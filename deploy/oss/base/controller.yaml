apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oss-csi-cds-controller
  namespace: kube-system
spec:
  replicas: 1
  serviceName: oss-csi-provisioner
  selector:
    matchLabels:
      app: oss-csi-cds-controller
  template:
    metadata:
      labels:
        app: oss-csi-cds-controller
        type: oss-csi-provisioner
    spec:
      serviceAccount: oss-cds-csi-sa
      hostNetwork: true
      hostPID: true
      priorityClassName: system-cluster-critical
      tolerations:
        - operator: Exists
      containers:
        - name: csi-controller-server
          image: registry-bj.capitalonline.net/cck/cds-csi-driver-oss:latest
          imagePullPolicy: Always
          args:
            - --endpoint=$(CSI_ENDPOINT)
            - --driver=oss.csi.cds.net
            - --nodeid=$(NODE_NAME)
          env:
            - name: CSI_ENDPOINT
              value: unix://socketDir/csi.sock
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: socket-dir
              mountPath: /socketDir
            - name: host-log
              mountPath: /var/log/
            - name: host-etc
              mountPath: /host/etc
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 100Mi
        - name: csi-provisioner
          image: harbor-dev.yun-paas.com/csi_agent/csi-provisioner:v3.1.0
          args:
            - --csi-address=$(ADDRESS)
            - --v=5
          env:
            - name: ADDRESS
              value: /socketDir/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /socketDir
        - name: liveness-probe
          image: registry-bj.capitalonline.net/cck/csi-livenessprobe:v2.0.0
          args:
            - --csi-address=/csi/csi.sock
            - --health-port=9808
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: host-log
          hostPath:
            path: /var/log/
        - name: host-etc
          hostPath:
            path: /etc
            type: Directory
