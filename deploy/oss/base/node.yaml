apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: oss-csi-cds-node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: oss-csi-cds-node
  template:
    metadata:
      labels:
        app: oss-csi-cds-node
    spec:
      initContainers:
      - name: install-oss-server
        image: registry-bj.capitalonline.net/cck/oss-server:v1.0.2
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -c
        - /install-oss.sh
        securityContext:
          privileged: true
        volumeMounts:
        - name: local-srv
          mountPath: /srv/
        - name: systemd
          mountPath: /host/config/system/
      tolerations:
      - operator: Exists
      priorityClassName: system-node-critical
      serviceAccount: oss-cds-csi-sa
      hostNetwork: true
      hostPID: true
      containers:
      - name: oss-csi-node-server
        securityContext:
          privileged: true
          capabilities:
            add: ["SYS_ADMIN"]
          allowPrivilegeEscalation: true
        image: registry-bj.capitalonline.net/cck/cds-csi-driver:latest
        imagePullPolicy: "Always"
        args:
        - "--endpoint=$(CSI_ENDPOINT)"
        - "--v=5"
        - "--driver=oss.csi.cds.net"
        env:
        - name: CSI_ENDPOINT
          value: unix://var/lib/kubelet/plugins/oss.csi.cds.net/csi.sock
        volumeMounts:
        - name: kubelet-dir
          mountPath: /var/lib/kubelet/
        - name: host-log
          mountPath: /var/log/
        - name: run
          mountPath: /var/run
          mountPropagation: Bidirectional
      - name: oss-driver-registrar
        image: registry-bj.capitalonline.net/cck/csi-node-driver-registrar:v1.2.0
        imagePullPolicy: Always
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "rm -rf /registration/oss.csi.cds.net /registration/oss.csi.cds.net-reg.sock"]
        args:
        - "--v=5"
        - "--csi-address=$(ADDRESS)"
        - "--kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)"
        env:
        - name: ADDRESS
          value: /var/lib/kubelet/plugins/oss.csi.cds.net/csi.sock
        - name: DRIVER_REG_SOCK_PATH
          value: /var/lib/kubelet/plugins/oss.csi.cds.net/csi.sock
        volumeMounts:
        - name: kubelet-dir
          mountPath: /var/lib/kubelet/
        - name: registration-dir
          mountPath: /registration/
      - name: oss-liveness-probe
        image: registry-bj.capitalonline.net/cck/csi-livenessprobe:v2.0.0
        args:
        - "--csi-address=/var/lib/kubelet/plugins/oss.csi.cds.net/csi.sock"
        - "--health-port=9808"
        volumeMounts:
        - name: kubelet-dir
          mountPath: /var/lib/kubelet/
      volumes:
      - name: kubelet-dir
        hostPath:
          path: /var/lib/kubelet
          type: Directory
      - name: registration-dir
        hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: DirectoryOrCreate
      - name: host-log
        hostPath:
          path: /var/log/
      - name: run
        hostPath:
          path: /var/run/
          type: DirectoryOrCreate
      - name: local-srv
        hostPath:
          path: /srv/
          type: DirectoryOrCreate
      - name: systemd
        hostPath:
          path: /usr/lib/systemd/system/
  updateStrategy:
    type: "RollingUpdate"
