apiVersion: v1
kind: ServiceAccount
metadata:
  name: oss-cds-csi-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oss-cds-csi-cluster-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
  - update
  - create
  - delete
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - csinodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - volumeattachments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - endpoints
  verbs:
  - get
  - watch
  - list
  - delete
  - update
  - create
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - watch
  - list
  - delete
  - update
  - create
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - csi.storage.k8s.io
  resources:
  - csinodeinfos
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - create
  - list
  - watch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oss-cds-csi-cluster-role-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oss-cds-csi-cluster-role
subjects:
- kind: ServiceAccount
  name: oss-cds-csi-sa
  namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    name: oss-csi-provisioner
  name: oss-csi-provisioner
  namespace: kube-system
spec:
  ports:
  - name: healthz
    port: 9808
  selector:
    type: oss-csi-provisioner
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oss-csi-cds-controller
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oss-csi-cds-controller
  serviceName: oss-csi-provisioner
  template:
    metadata:
      labels:
        app: oss-csi-cds-controller
        type: oss-csi-provisioner
    spec:
      containers:
      - args:
        - --endpoint=$(CSI_ENDPOINT)
        - --driver=oss.csi.cds.net
        - --nodeid=$(NODE_NAME)
        env:
        - name: CSI_ENDPOINT
          value: unix://socketDir/csi.sock
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: harbor-dev.yun-paas.com/storage_image/cds-csi-driver-oss:v2.2.1
        imagePullPolicy: Always
        name: csi-controller-server
        resources:
          limits:
            cpu: 100m
            memory: 100Mi
          requests:
            cpu: 100m
            memory: 100Mi
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /socketDir
          name: socket-dir
        - mountPath: /var/log/
          name: host-log
        - mountPath: /host/etc
          name: host-etc
          readOnly: true
      - args:
        - --csi-address=$(ADDRESS)
        - --v=5
        env:
        - name: ADDRESS
          value: /socketDir/csi.sock
        image: harbor-dev.yun-paas.com/csi_agent/csi-provisioner:v3.1.0
        name: csi-provisioner
        volumeMounts:
        - mountPath: /socketDir
          name: socket-dir
      - args:
        - --csi-address=/csi/csi.sock
        - --health-port=9808
        image: harbor-dev.yun-paas.com/csi_agent/csi-livenessprobe:v2.0.0
        name: liveness-probe
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      hostNetwork: true
      hostPID: true
      priorityClassName: system-cluster-critical
      serviceAccount: oss-cds-csi-sa
      tolerations:
      - operator: Exists
      volumes:
      - emptyDir: {}
        name: socket-dir
      - hostPath:
          path: /var/log/
        name: host-log
      - hostPath:
          path: /etc
          type: Directory
        name: host-etc
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: oss-csi-cds-node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: oss-csi-cds-node
  template:
    metadata:
      labels:
        app: oss-csi-cds-node
    spec:
      containers:
      - args:
        - --endpoint=$(CSI_ENDPOINT)
        - --v=5
        - --driver=oss.csi.cds.net
        - --nodeid=$(NODE_NAME)
        env:
        - name: CSI_ENDPOINT
          value: unix://var/lib/kubelet/plugins/oss.csi.cds.net/csi.sock
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: harbor-dev.yun-paas.com/storage_image/cds-csi-driver-oss:v2.2.1
        imagePullPolicy: Always
        name: oss-csi-node-server
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
        volumeMounts:
        - mountPath: /var/lib/kubelet/
          mountPropagation: Bidirectional
          name: kubelet-dir
        - mountPath: /dev/fuse
          name: fuse-device
        - mountPath: /var/log/
          name: host-log
        - mountPath: /host/etc
          name: host-etc
          readOnly: true
      - args:
        - --v=5
        - --csi-address=$(ADDRESS)
        - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
        env:
        - name: ADDRESS
          value: /var/lib/kubelet/plugins/oss.csi.cds.net/csi.sock
        - name: DRIVER_REG_SOCK_PATH
          value: /var/lib/kubelet/plugins/oss.csi.cds.net/csi.sock
        image: harbor-dev.yun-paas.com/csi_agent/csi-node-driver-registrar:v1.2.0
        imagePullPolicy: Always
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - rm -rf /registration/oss.csi.cds.net /registration/oss.csi.cds.net-reg.sock
        name: oss-driver-registrar
        volumeMounts:
        - mountPath: /var/lib/kubelet/
          name: kubelet-dir
        - mountPath: /registration/
          name: registration-dir
      - args:
        - --csi-address=/var/lib/kubelet/plugins/oss.csi.cds.net/csi.sock
        - --health-port=9808
        image: harbor-dev.yun-paas.com/csi_agent/csi-livenessprobe:v2.0.0
        name: oss-liveness-probe
        volumeMounts:
        - mountPath: /var/lib/kubelet/
          name: kubelet-dir
      hostNetwork: true
      hostPID: true
      priorityClassName: system-node-critical
      serviceAccount: oss-cds-csi-sa
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /var/lib/kubelet
          type: Directory
        name: kubelet-dir
      - hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: DirectoryOrCreate
        name: registration-dir
      - hostPath:
          path: /var/log/
        name: host-log
      - hostPath:
          path: /etc
          type: Directory
        name: host-etc
      - hostPath:
          path: /dev/fuse
          type: CharDevice
        name: fuse-device
  updateStrategy:
    type: RollingUpdate
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: oss.csi.cds.net
spec:
  attachRequired: false
