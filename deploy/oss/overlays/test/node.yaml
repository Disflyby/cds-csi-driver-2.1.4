apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: oss-csi-cds-node
  namespace: kube-system
spec:
  template:
    spec:
      containers:
        - name: oss-csi-node-server
          args:
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--v=5"
            - "--driver=oss.csi.cds.net"
            - "--nodeid=dummy"
